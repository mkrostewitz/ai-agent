name: Deploy GPU Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gpu-droplet
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_BRANCH: main
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ai-agent' }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
      DROPLET_PORT: ${{ secrets.DROPLET_PORT || '22' }}
      DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
      DROPLET_USER: ${{ secrets.DROPLET_USER || 'root' }}
    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$DROPLET_HOST"
          test -n "$DROPLET_SSH_KEY"

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DROPLET_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if [ -n "$DROPLET_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DROPLET_PORT" "$DROPLET_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy on Droplet
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DROPLET_PORT" "$DROPLET_USER@$DROPLET_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -se" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"

          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --services
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml ps
          REMOTE
