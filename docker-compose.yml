version: "3.9"

services:
  web:
    build: .
    container_name: ai-agent-web
    restart: unless-stopped
    environment:
      OLLAMA_NUM_THREAD: "4"
    ports:
      - "3030:3030"
    env_file:
      - .env.docker
    volumes:
      - app_public_uploads:/app/public/uploads
      - app_private_uploads:/app/storage/uploads
    depends_on:
      - mongo
      - ollama

  mongo:
    image: mongo:8
    container_name: ai-agent-mongo
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/mongo-entrypoint.sh"]

  ollama:
    image: ollama/ollama:latest
    container_name: ai-agent-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_THREAD: "4"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_MAX_QUEUE: "32"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint-ollama.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
volumes:
  app_private_uploads:
    name: "${COMPOSE_PROJECT_NAME:-ai-agent}_app_private_uploads"
  app_public_uploads:
    name: "${COMPOSE_PROJECT_NAME:-ai-agent}_app_public_uploads"
  mongo_data:
    name: "${COMPOSE_PROJECT_NAME:-ai-agent}_mongo_data"
  ollama_data:
    name: "${COMPOSE_PROJECT_NAME:-ai-agent}_ollama_data"
